<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéSocial - Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF6B6B 0%, #4ECDC4 50%, #FFE66D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 5px solid #FF1744;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #FF1744;
            font-size: 2.5em;
            text-shadow: 3px 3px 0px #00E5FF, -1px -1px 0px #FFD700;
            margin-bottom: 10px;
        }

        .pokeball {
            width: 60px;
            height: 60px;
            background: linear-gradient(180deg, #FF0000 50%, white 50%);
            border-radius: 50%;
            border: 4px solid #333;
            position: relative;
            margin: 0 auto 20px;
        }

        .pokeball::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border: 4px solid #333;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .pokeball::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 4px;
            background: #333;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #FF1744;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"] {
            width: 100%;
            padding: 12px 15px;
            border: 3px solid #00E5FF;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            background: linear-gradient(135deg, #FFF9C4 0%, #FFE0B2 100%);
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="date"]:focus {
            outline: none;
            border-color: #FF1744;
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.5);
            transform: scale(1.02);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin: 25px 0;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .checkbox-group label {
            margin: 0;
            font-weight: normal;
            color: #333;
            font-size: 0.9em;
        }

        .checkbox-group a {
            color: #3B4CCA;
            text-decoration: none;
            font-weight: bold;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FF0000 0%, #CC0000 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9em;
            margin-top: -10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="pokeball"></div>
            <h1>POKÉSOCIAL</h1>
            <p class="subtitle">¡Únete a la comunidad de entrenadores!</p>
        </div>

        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de nacimiento</label>
                <input type="date" id="fecha" name="fecha" required>
            </div>

            <div class="form-group">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">
                    Acepto los <a href="#" onclick="event.preventDefault()">términos y condiciones</a> de PokéSocial
                </label>
            </div>

            <button type="submit">¡Capturar cuenta!</button>
        </form>
    </div>

    <script>
        document.getElementById('registroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                nombre: document.getElementById('nombre').value,
                apellidos: document.getElementById('apellidos').value,
                fecha: document.getElementById('fecha').value,
                usuario: document.getElementById('usuario').value,
                email: document.getElementById('email').value
            };
            
            alert('¡Bienvenido a PokéSocial, ' + formData.usuario + '! 🎉\n\nTu cuenta ha sido creada exitosamente.');
            
            this.reset();
        });
    </script>
</body>
</html>
